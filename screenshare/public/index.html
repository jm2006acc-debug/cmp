<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Compartilhar Tela</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --text: #eef0f4;
    --muted: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #0f1115, #181c26);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 880px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  p.sub {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    margin-bottom: 20px;
  }
  .linha {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2f3a;
    background: #0f1218;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    padding: 12px 18px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primario {
    background: linear-gradient(135deg, var(--accent), #8e7bff);
    color: white;
  }
  .btn-secundario {
    background: #232838;
    color: var(--text);
  }
  .btn-parar {
    background: #e74c3c;
    color: white;
  }
  select {
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #2a2f3a;
    background: #0f1218;
    color: var(--text);
    font-size: 0.9rem;
  }
  #status {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 10px;
    min-height: 20px;
  }
  .videos {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  video {
    width: 100%;
    background: #000;
    border-radius: 12px;
    border: 1px solid #2a2f3a;
  }
  .video-label {
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  code {
    background: #0f1218;
    padding: 3px 8px;
    border-radius: 6px;
    color: var(--accent2);
  }
</style>
</head>
<body>
<div class="app">
  <h1>🖥️ Compartilhamento de Tela</h1>
  <p class="sub">Crie uma sala, compartilhe o código com a outra pessoa e comece a compartilhar sua tela.</p>

  <div class="card">
    <div class="linha">
      <input type="text" id="codigoSala" placeholder="Código da sala (ex: azul-123)" />
      <button class="btn-secundario" id="btnGerarCodigo">Gerar código</button>
      <button class="btn-primario" id="btnEntrar">Entrar na sala</button>
    </div>
    <div id="status">Digite ou gere um código e entre na sala.</div>
  </div>

  <div class="card" id="cardControles" style="display:none;">
    <div class="linha">
      <label for="seletorResolucao" style="color: var(--muted); font-size: 0.9rem;">Resolução:</label>
      <select id="seletorResolucao">
        <option value="720">HD (1280x720)</option>
        <option value="1080" selected>Full HD (1920x1080)</option>
        <option value="1440">2K (2560x1440)</option>
      </select>
      <button class="btn-primario" id="btnCompartilhar">Compartilhar minha tela</button>
      <button class="btn-parar" id="btnParar" disabled>Parar compartilhamento</button>
    </div>
  </div>

  <div class="videos">
    <div>
      <div class="video-label">Sua tela (pré-visualização)</div>
      <video id="videoLocal" autoplay muted playsinline></video>
    </div>
    <div>
      <div class="video-label">Tela recebida</div>
      <video id="videoRemoto" autoplay playsinline></video>
    </div>
  </div>
</div>

<script>
const elCodigo = document.getElementById('codigoSala');
const elStatus = document.getElementById('status');
const elCardControles = document.getElementById('cardControles');
const videoLocal = document.getElementById('videoLocal');
const videoRemoto = document.getElementById('videoRemoto');
const btnEntrar = document.getElementById('btnEntrar');
const btnGerarCodigo = document.getElementById('btnGerarCodigo');
const btnCompartilhar = document.getElementById('btnCompartilhar');
const btnParar = document.getElementById('btnParar');
const seletorResolucao = document.getElementById('seletorResolucao');

const resolucoes = {
  '720': { largura: 1280, altura: 720 },
  '1080': { largura: 1920, altura: 1080 },
  '1440': { largura: 2560, altura: 1440 }
};

let ws = null;
let pc = null;
let streamLocal = null;
let salaAtual = null;
let jaTemPar = false;

const configuracaoIce = {
  iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
};

function definirStatus(texto) {
  elStatus.textContent = texto;
}

btnGerarCodigo.addEventListener('click', () => {
  const palavras = ['azul', 'verde', 'sol', 'lua', 'rio', 'monte', 'nuvem', 'onda'];
  const palavra = palavras[Math.floor(Math.random() * palavras.length)];
  const numero = Math.floor(100 + Math.random() * 900);
  elCodigo.value = `${palavra}-${numero}`;
});

btnEntrar.addEventListener('click', () => {
  const codigo = elCodigo.value.trim();
  if (!codigo) {
    definirStatus('Digite um código de sala antes de entrar.');
    return;
  }
  conectarWebSocket(codigo);
});

function conectarWebSocket(codigo) {
  const protocolo = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocolo}//${location.host}`);

  ws.onopen = () => {
    salaAtual = codigo;
    ws.send(JSON.stringify({ tipo: 'entrar-na-sala', codigo }));
  };

  ws.onmessage = async (evento) => {
    const msg = JSON.parse(evento.data);

    if (msg.tipo === 'sala-cheia') {
      definirStatus('Essa sala já tem 2 pessoas. Tente outro código.');
      return;
    }

    if (msg.tipo === 'entrou') {
      definirStatus(`Você entrou na sala "${codigo}". Aguardando a outra pessoa...`);
      elCardControles.style.display = 'block';
      criarConexaoPeer();
      return;
    }

    if (msg.tipo === 'par-entrou') {
      jaTemPar = true;
      definirStatus('A outra pessoa entrou! Clique em "Compartilhar minha tela" quando quiser.');
      return;
    }

    if (msg.tipo === 'par-saiu') {
      jaTemPar = false;
      definirStatus('A outra pessoa saiu da sala.');
      videoRemoto.srcObject = null;
      return;
    }

    if (msg.tipo === 'oferta') {
      if (!pc) criarConexaoPeer();
      await pc.setRemoteDescription(new RTCSessionDescription(msg.dados));
      const resposta = await pc.createAnswer();
      await pc.setLocalDescription(resposta);
      ws.send(JSON.stringify({ tipo: 'resposta', dados: resposta }));
      return;
    }

    if (msg.tipo === 'resposta') {
      await pc.setRemoteDescription(new RTCSessionDescription(msg.dados));
      return;
    }

    if (msg.tipo === 'ice') {
      if (pc && msg.dados) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(msg.dados));
        } catch (e) {
          console.error('Erro ao adicionar ICE candidate', e);
        }
      }
      return;
    }
  };

  ws.onclose = () => definirStatus('Conexão com o servidor encerrada.');
}

function criarConexaoPeer() {
  pc = new RTCPeerConnection(configuracaoIce);

  pc.onicecandidate = (evento) => {
    if (evento.candidate) {
      ws.send(JSON.stringify({ tipo: 'ice', dados: evento.candidate }));
    }
  };

  pc.ontrack = (evento) => {
    videoRemoto.srcObject = evento.streams[0];
  };
}

btnCompartilhar.addEventListener('click', async () => {
  const resolucaoEscolhida = resolucoes[seletorResolucao.value];

  try {
    streamLocal = await navigator.mediaDevices.getDisplayMedia({
      video: {
        width: { ideal: resolucaoEscolhida.largura },
        height: { ideal: resolucaoEscolhida.altura },
        frameRate: { ideal: 30 }
      },
      audio: false
    });
  } catch (e) {
    definirStatus('Não foi possível iniciar o compartilhamento (permissão negada?).');
    return;
  }

  videoLocal.srcObject = streamLocal;

  if (!pc) criarConexaoPeer();

  streamLocal.getTracks().forEach((track) => {
    pc.addTrack(track, streamLocal);
  });

  streamLocal.getVideoTracks()[0].addEventListener('ended', pararCompartilhamento);

  const oferta = await pc.createOffer();
  await pc.setLocalDescription(oferta);
  ws.send(JSON.stringify({ tipo: 'oferta', dados: oferta }));

  btnCompartilhar.disabled = true;
  btnParar.disabled = false;
  seletorResolucao.disabled = true;
  definirStatus(`Compartilhando sua tela em até ${resolucaoEscolhida.largura}x${resolucaoEscolhida.altura}...`);
});

btnParar.addEventListener('click', pararCompartilhamento);

function pararCompartilhamento() {
  if (streamLocal) {
    streamLocal.getTracks().forEach((t) => t.stop());
    streamLocal = null;
  }
  videoLocal.srcObject = null;
  btnCompartilhar.disabled = false;
  btnParar.disabled = true;
  seletorResolucao.disabled = false;
  definirStatus('Compartilhamento encerrado.');
}
</script>
</body>
</html>
